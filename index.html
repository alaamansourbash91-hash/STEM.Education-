<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Four STEM Fields</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            text-align: center;
            padding: 20px;
        }

        h1 {
            color: #333;
            margin-bottom: 30px;
        }

        .stem-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            max-width: 1000px;
            margin: 0 auto;
        }

        .stem-card {
            background: #ffffff;
            border-radius: 12px;
            padding: 15px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .stem-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 18px rgba(0, 0, 0, 0.15);
        }

        .stem-link {
            text-decoration: none;
            color: inherit;
            display: block;
        }

        .img-wrapper {
            width: 100%;
            height: 180px;
            border-radius: 8px;
            overflow: hidden;
            margin-bottom: 12px;
        }

        .img-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s ease;
        }

        .stem-card:hover .img-wrapper img {
            transform: scale(1.05);
        }

        .stem-title {
            font-size: 1.2rem;
            font-weight: bold;
            color: #2c3e50;
            margin-top: 5px;
        }
    </style>
</head>
<body>

    <h1>The Four STEM Fields</h1>

    <div class="stem-container">
        
        <!-- Science -->
        <div class="stem-card">
            <a href="https://wa.me/qr/LFIXJERYL57KB1" target="_blank" class="stem-link">
                <div class="img-wrapper">
                    <img src="2725.jpg" alt="Science">
                </div>
                <div class="stem-title">Science</div>
            </a>
        </div>

        <!-- Technology -->
        <div class="stem-card">
            <a href="https://wa.me/qr/LFIXJERYL57KB1" target="_blank" class="stem-link">
                <div class="img-wrapper">
                    <img src="2727.jpg" alt="Technology">
                </div>
                <div class="stem-title">Technology</div>
            </a>
        </div>

        <!-- Engineering -->
        <div class="stem-card">
            <a href="https://wa.me/qr/LFIXJERYL57KB1" target="_blank" class="stem-link">
                <div class="img-wrapper">
                    <img src="2724.jpg" alt="Engineering">
                </div>
                <div class="stem-title">Engineering</div>
            </a>
        </div>

        <!-- Math -->
        <div class="stem-card">
            <a href="https://wa.me/qr/LFIXJERYL57KB1" target="_blank" class="stem-link">
                <div class="img-wrapper">
                    <img src="2726.jpg" alt="Math">
                </div>
                <div class="stem-title">Math</div>
            </a>
        </div>

    </div>

</body>
</html>
